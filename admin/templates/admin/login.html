<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusBot Admin — Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0f;
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            position: relative; overflow: hidden;
        }
        body::before {
            content: '';
            position: absolute; inset: 0;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(124,58,237,0.15) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(79,70,229,0.1) 0%, transparent 60%),
                radial-gradient(ellipse at 60% 80%, rgba(6,182,212,0.08) 0%, transparent 60%);
        }
        .login-box {
            background: rgba(22,22,32,0.8);
            border: 1px solid rgba(42,42,62,0.8);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 48px 40px;
            width: 100%; max-width: 420px;
            position: relative; z-index: 1;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }
        .logo {
            text-align: center; margin-bottom: 36px;
        }
        .logo h1 {
            font-size: 32px; font-weight: 800;
            background: linear-gradient(135deg, #7c3aed, #4f46e5, #06b6d4);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .logo p { color: #64748b; font-size: 14px; margin-top: 6px; }
        .form-group { margin-bottom: 20px; }
        label {
            display: block; font-size: 12px; font-weight: 600;
            color: #94a3b8; margin-bottom: 8px; letter-spacing: 0.5px;
        }
        input {
            width: 100%; padding: 14px 16px;
            background: rgba(26,26,39,0.8); border: 1px solid #2a2a3e;
            border-radius: 12px; color: #e2e8f0;
            font-size: 14px; font-family: 'Inter', sans-serif;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input:focus {
            outline: none; border-color: #7c3aed;
            box-shadow: 0 0 0 3px rgba(124,58,237,0.15);
        }
        .btn-login {
            width: 100%; padding: 14px;
            background: linear-gradient(135deg, #7c3aed, #4f46e5);
            border: none; border-radius: 12px;
            color: white; font-size: 15px; font-weight: 700;
            cursor: pointer; transition: all 0.2s;
            box-shadow: 0 8px 25px rgba(124,58,237,0.4);
            margin-top: 8px;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(124,58,237,0.5);
        }
        .btn-login:active { transform: translateY(0); }
        .alert {
            padding: 12px 16px; border-radius: 10px; margin-bottom: 20px;
            font-size: 13px; background: rgba(239,68,68,0.1);
            border: 1px solid rgba(239,68,68,0.3); color: #fca5a5;
        }
        .lock-icon {
            text-align: center; font-size: 48px; margin-bottom: 16px;
        }
        .footer-note {
            text-align: center; margin-top: 24px;
            font-size: 11px; color: #475569;
        }
    </style>
</head>
<body>
<div class="login-box">
    <div class="logo">
        <div class="lock-icon">🔐</div>
        <h1>⚡ NexusBot</h1>
        <p>Admin Control Panel — Authorized Access Only</p>
    </div>
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="alert">{{ message }}</div>
        {% endfor %}
    {% endwith %}
    <form method="POST">
        <div class="form-group">
            <label>USERNAME</label>
            <input type="text" name="username" placeholder="Enter admin username" autofocus required>
        </div>
        <div class="form-group">
            <label>PASSWORD</label>
            <input type="password" name="password" placeholder="Enter admin password" required>
        </div>
        <button type="submit" class="btn-login">🚀 Access Panel</button>
    </form>
    <div class="footer-note">NexusBot Admin v1.0 — Unauthorized access is prohibited</div>
</div>
</body>
</html>
