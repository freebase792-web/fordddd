services:
  - type: web
    name: nexusbot
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt && python -c "from bot.models.database import init_db; init_db()"
    startCommand: gunicorn wsgi:app --workers 2 --threads 8 --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_SECRET
        sync: false
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_TELEGRAM_ID
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: nexusbot-db
          property: connectionString
      - key: WEBHOOK_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: PORT
        value: "8000"

databases:
  - name: nexusbot-db
    region: oregon
    plan: free
    databaseName: nexusbot
    user: nexusbot_user
